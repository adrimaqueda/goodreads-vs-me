<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Meta tags para SEO y redes sociales -->
		<meta
			name="description"
			content="Compara tus puntuaciones de Goodreads con las del resto de usuarios"
		/>
		<meta name="theme-color" content="#ffffff" />

		<!-- Open Graph meta tags para Facebook, LinkedIn, etc -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Goodreads vs Me" />
		<meta
			property="og:description"
			content="Compara tus puntuaciones de Goodreads con las del resto de usuarios"
		/>
		<meta property="og:image" content="/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Goodreads vs Me - Compara tus puntuaciones con las del resto de usuarios"
		/>
		<meta property="og:url" content="%sveltekit.url%" />
		<meta property="og:locale" content="es_ES" />

		<!-- Twitter Card meta tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Goodreads vs Me" />
		<meta
			name="twitter:description"
			content="Compara tus puntuaciones de Goodreads con las del resto de "
		/>
		<meta name="twitter:image" content="/og.png" />
		<meta
			name="twitter:image:alt"
			content="Goodreads vs Me - Compara tus puntuaciones con las del resto de usuarios"
		/>

		<!-- Otras meta tags importantes -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Goodreads vs Me" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
